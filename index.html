2px"><b>Сохранение сейчас</b><p style="color:var(--muted);line-height:1.4">Прогресс хранится на этом устройстве в IndexedDB и работает офлайн. Для переноса между iPhone, Android и компьютером следующим серверным этапом подключим аккаунт и облачную синхронизацию.</p></article></section>${nav('progress')}`;bindCommon();}

  function weakWordsForAI(limit=10){
    return words.filter(w=>pFor(w.id).level===1).sort((a,b)=>(pFor(b.id).errors||0)-(pFor(a.id).errors||0)).slice(0,limit);
  }
  function masteredWordsForAI(limit=18){
    return words.filter(w=>pFor(w.id).level>=2).sort((a,b)=>b.order-a.order).slice(0,limit);
  }
  function aiSystemPrompt(){
    const st=stageStats();
    const lang=selectedLanguage();
    const weakList=weakWordsForAI().map(w=>`${w.arabic} = ${w.russian}`).join('; ')||'пока нет';
    const known=masteredWordsForAI().map(w=>`${w.arabic} = ${w.russian}`).join('; ')||'пока почти нет';
    const m=mastered();
    const targetName=lang.id==='lak'?'лакского':lang.id==='sa'?'саудовского арабского':lang.name;
    const russianShare=m<40?`примерно 75% русского и 25% простого ${targetName}`:m<120?`примерно половина русского и половина ${targetName}`:`в основном ${targetName}, русский только для коротких подсказок`;
    const courseLexicon=lang.id==='lak'?words.map(w=>`${w.arabic} = ${w.russian}`).join('; '):'';
    const accuracyRule=lang.id==='lak'?`Для лакского особенно важна точность. Используй лакские слова и фразы ТОЛЬКО из проверенного словаря курса ниже. Не придумывай новые лакские формы. Если нужной формы нет, объясни по-русски и предложи ближайшую проверенную фразу. Проверенный словарь курса: ${courseLexicon}.`:'';
    return `Ты постоянный ИИ-помощник приложения «ЛегкоЯзык». Твоя роль сейчас: ${assistantRole()}. Пользователь учит ${lang.aiTarget||lang.name}. Его текущий этап: ${st.i+1} (${st.name}), освоено ${m} слов и фраз, осталось в текущем этапе ${st.remaining}.\n\nСтиль: общайся легко, тепло и очень коротко. Один ответ обычно 1–3 коротких предложения. Используй ${russianShare}. Не перегружай грамматикой. Исправляй максимум одну важную ошибку за раз. ${accuracyRule}\n\nГлавная задача — разговорная практика. Постепенно используй уже знакомые слова. Слабые слова возвращай в естественный разговор. Если пользователь не знает ответ — подскажи и продолжай.\n\nУже знакомые слова/фразы: ${known}.\nСлабые слова/фразы: ${weakList}.\n\nОтвечай обычным текстом без JSON, без заголовков и без длинных списков.`;
  }
  function aiText(response){
    if(typeof response==='string')return response.trim();
    const generated=response?.[0]?.generated_text ?? response?.generated_text ?? response;
    if(Array.isArray(generated)){
      const assistant=[...generated].reverse().find(x=>x?.role==='assistant');
      return String(assistant?.content||'').trim();
    }
    if(generated?.content)return String(generated.content).trim();
    return String(generated||'').trim();
  }
  function sleep(ms){return new Promise(r=>setTimeout(r,ms));}

  function progressLabel(p){

  async function connectAIFromUserAction(){
    state.aiStatus='ready';
    state.aiModel='built-in-voice-coach';

  function aiTimeout(promise,ms=90000){return Promise.race([promise,new Promise((_,reject)=>setTimeout(()=>reject(new Error('ИИ не ответил вовремя')),ms))]);}
  async function askAI(userText,{silent=false}={}){
    await connectAIFromUserAction();
    if(!localAIGenerator){
      const fallback=coachReply(userText)[0];
      state.aiHistory.push({role:'user',content:userText},{role:'assistant',content:fallback});
      if(state.aiHistory.length>14)state.aiHistory=state.aiHistory.slice(-14);
      state.aiStatus='online';state.aiModel='built-in-voice-coach';state.liveError='';
      return fallback;
    }
    const history=state.aiHistory.slice(-6);
    const messages=[{role:'system',content:aiSystemPrompt()},...history,{role:'user',content:userText}];
    state.aiStatus='thinking';
    try{
      const response=await aiTimeout(localAIGenerator(messages,{
        max_new_tokens:110,
        do_sample:true,
        temperature:.65,
        top_p:.9,
        repetition_penalty:1.08
      }));
      const reply=aiText(response);
      if(!reply)throw new Error('ИИ вернул пустой ответ');
      state.aiHistory.push({role:'user',content:userText},{role:'assistant',content:reply});
      if(state.aiHistory.length>14)state.aiHistory=state.aiHistory.slice(-14);
      state.aiStatus='online';state.aiModel=LOCAL_AI_MODEL;state.liveError='';
      return reply;
    }catch(err){state.aiStatus='offline';throw err;}
  }
  function stopLiveMedia(){

  async function startLiveConversation(){

    state.liveActive=true;state.liveError='';

      await connectAIFromUserAction();

  async function beginAutoListening(){
    if(!state.liveActive)return;
    stopLiveMedia();
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){state.liveActive=false;state.liveError='Распознавание речи в Safari недоступно. Используй поле ввода внизу.';renderTeacher();return;}
    try{
      const rec=new SR();
      state.liveRecognition=rec;
      let handled=false;
      rec.lang=selectedLanguage().speechLang||'ru-RU';
      rec.interimResults=false;
      rec.continuous=false;
      rec.maxAlternatives=1;
      rec.onstart=()=>liveSet('listening','Я слушаю — говори свободно');
      rec.onresult=async(event)=>{
        handled=true;state.liveRecognition=null;
        const said=String(event.results?.[0]?.[0]?.transcript||'').trim();
        if(!said){if(state.liveActive)setTimeout(()=>beginAutoListening(),450);return;}
        await handleRecognizedSpeech(said);
      };
      rec.onerror=(event)=>{
        console.warn('Speech recognition error',event?.error);
        state.liveRecognition=null;
        if(event?.error==='not-allowed'||event?.error==='service-not-allowed'){
          state.liveActive=false;state.liveError='Разреши микрофон для этого сайта в Safari и запусти разговор снова.';renderTeacher();
        }else if(state.liveActive&&event?.error!=='aborted'){
          liveSet('listening','Не расслышал — попробуй ещё раз');setTimeout(()=>beginAutoListening(),650);
        }
      };
      rec.onend=()=>{
        state.liveRecognition=null;
        if(state.liveActive&&!handled)setTimeout(()=>beginAutoListening(),500);
      };
      rec.start();
    }catch(err){
      console.warn(err);state.liveActive=false;state.liveRecognition=null;
      state.liveError='Не получилось включить распознавание речи. Можно писать ответы внизу.';renderTeacher();
    }
  }
  async function handleRecognizedSpeech(said){
    if(!state.liveActive)return;
    liveSet('thinking','Думаю над ответом…');
    try{
      state.chat.push({user:true,text:said,hint:''});
      renderTeacher();liveSet('thinking','Думаю над ответом…');
      const reply=await askAI(said);
      state.chat.push({user:false,text:reply,hint:''});
      state.settings.speakingSessions++;
      state.settings.dailyPoints+=20;
      await saveSettings();
      renderTeacher();
      await speakNatural(reply,.74);
      if(state.liveActive)await beginAutoListening();
    }catch(err){
      console.warn(err);
      state.liveError='Локальный ИИ временно не ответил. Продолжаю встроенной подсказкой.';
      const fallback=coachReply(said)[0]||'Давай ещё раз, совсем спокойно.';
      state.chat.push({user:false,text:fallback,hint:''});
      renderTeacher();voiceMessage(state.liveError);
      await speakNatural(fallback,.72);
      if(state.liveActive)await beginAutoListening();
    }
  }

  function coachReply(input){
    const t=input.toLowerCase();
    if(selectedLanguage().id==='lak'){
      const by=id=>words.find(w=>w.id===id), pick=(id,hint)=>{const w=by(id);return [w?.arabic||hint,hint];};
      if(t.includes('спас')||t.includes('барч'))return pick('lak006','Спасибо');
      if(t.includes('дел')||t.includes('как'))return pick('lak002','Как идут дела?');
      if(t.includes('здоров'))return pick('lak010','Как ваше здоровье?');
      return pick('lak004','Что нового?');
    }
    if(t.includes('привет')||t.includes('هلا')||t.includes('السلام'))return ['هلا والله! شلونك؟','Привет! Как ты?'];
    if(t.includes('коф')||t.includes('قهوة'))return ['تمام. قل: أبغى قهوة، لو سمحت.','Хорошо. Скажи: «Я хочу кофе, пожалуйста».'];
    if(t.includes('вод')||t.includes('موية'))return ['ممتاز! قل: أبغى موية.','Отлично. Скажи, что хочешь воды.'];
    if(t.includes('не понимаю')||t.includes('ما فهمت'))return ['عادي. قل: ما فهمت، تكلم شوي شوي.','Попроси говорить помедленнее.'];
    return ['زين! خلنا نجرب: أبغى هذا.','Попробуем простую фразу.'];
  }
  function renderTeacher(){
    const liveLabel=state.liveActive?'Остановить живой разговор':'Начать живой разговор';
    const liveAction=state.liveActive?'liveStop':'liveStart';
    const phase=state.liveActive?state.livePhase:'idle';
    const status=state.liveActive?(phase==='listening'?'Я слушаю — говори свободно':phase==='thinking'?'Думаю над ответом…':phase==='speaking'?'Отвечаю…':'Разговор активен'):'Один раз нажми — дальше говорим без постоянного нажатия микрофона';
    app.innerHTML=`<section class="screen"><header class="topbar"><div class="bot">🤖</div><div><h1>Помощник · ${assistantRole()}</h1><p>Навигатор постепенно становится преподавателем и собеседником</p><span class="ai-badge">${state.aiStatus==='online'?'✨ Встроенный ИИ работает':state.aiStatus==='thinking'?'💭 ИИ думает…':state.aiStatus==='loading'?'⏳ Запускаю ИИ…':state.aiStatus==='ready'?'✅ ИИ готов':state.aiStatus==='offline'?'⚠️ ИИ не запущен':'🤖 Встроенный ИИ · без регистрации'}</span></div></header>
    <div class="live-panel"><div id="liveOrb" class="live-orb ${phase}">${phase==='listening'?'🎧':phase==='thinking'?'💭':phase==='speaking'?'🗣️':'🤖'}</div><div id="liveStatus" class="live-status">${e(status)}</div><div class="live-sub">Голосовой помощник работает сразу: без Puter, без аккаунта, без номера телефона, без API‑ключа и без загрузки большой модели.</div><div id="aiProgress" class="hint" style="margin:10px 0 0">${e(state.aiProgress||'')}</div><div class="live-actions"><button class="btn ${state.liveActive?'secondary':'primary'}" data-action="${liveAction}">${state.liveActive?'■':'▶'} ${liveLabel}</button>${state.aiStatus==='offline'?`<button class="btn soft" data-action="aiConnect">↻ Запустить ИИ ещё раз</button>`:``}</div></div>
    <div id="voiceStatus" class="fact" style="${state.liveError?'':'display:none;'}margin-top:10px">${e(state.liveError)}</div>
    <div class="chat" style="margin-top:14px">${state.chat.slice(-12).map(x=>`<div class="bubble ${x.user?'userb':'botb'}"><div class="arabic" dir="${targetDir()}">${e(x.text)}</div>${x.hint?`<small>${e(x.hint)}</small>`:''}${!x.user?`<div><button class="link-btn" data-say="${e(x.text)}">🔊 Слушать ещё раз</button></div>`:''}</div>`).join('')}</div>
    <div class="inputrow"><input id="chatInput" placeholder="Можно также написать ответ…" autocomplete="off"><button class="roundbtn" data-action="voice" aria-label="Говорить">🎤</button><button class="roundbtn" data-action="send" aria-label="Отправить">➤</button></div></section>${nav('teacher')}`;bindCommon();
  }

  function showModal(type){
    let body='';
    if(type==='install'){
      body=`<button class="close" data-action="close">×</button><h2>Добавить на iPhone</h2><p>1. Открой сайт в Safari.<br>2. Нажми кнопку «Поделиться».<br>3. Выбери «На экран Домой».<br>4. Нажми «Добавить».</p><p>После этого «ЛегкоЯзык» будет открываться с отдельной иконки почти как обычное приложение.</p>`;
    }else if(type==='languages'){
      const current=selectedLanguage().id;
      body=`<button class="close" data-action="close">×</button><h2>🌍 Выбери язык</h2><p>У каждого языка будет свой отдельный прогресс.</p><div class="language-list">${LANGUAGES.map(l=>`<button class="language-option ${l.id===current?'selected':''}" data-lang="${l.id}"><span class="language-flag">${l.flag}</span><span class="language-copy"><b>${e(l.name)}</b><small>${e(l.detail)}</small></span><span>${l.id===current?'✓':l.ready?'›':'скоро'}</span></button>`).join('')}</div>`;
    }else{
      body=`<button class="close" data-action="close">×</button><h2>🤖 Твой помощник</h2><p><b>Сейчас я ${assistantRole()}.</b></p><p>${e(assistantMessage())}</p><div class="fact"><b>Небольшой факт:</b> ${e(cultureFact())}</div><button class="btn primary" style="width:100%;margin-top:14px" data-action="teacher">Поговорить</button>`;
    }
    document.body.insertAdjacentHTML('beforeend',`<div class="modal-back" id="modal"><div class="modal">${body}</div></div>`);bindCommon(document.getElementById('modal'));
  }

  function bindCommon(root=document){
    root.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{if(state.liveActive&&b.dataset.nav!=='teacher')stopLiveConversation();state.view=b.dataset.nav;render()});
    root.querySelectorAll('[data-action]').forEach(b=>b.onclick=async()=>{
      const a=b.dataset.action;
      if(a==='start5')startLesson(smartLesson(5));
      else if(a==='start3')startLesson(smartLesson(3));
      else if(a==='review')startLesson(reviewLesson(5),true);
      else if(a==='assistant')showModal('assistant');
      else if(a==='languages')showModal('languages');
      else if(a==='install')showModal('install');
      else if(a==='close')document.getElementById('modal')?.remove();
      else if(a==='exit'){state.view='home';render();}
      else if(a==='reveal'){state.reveal=true;render();}
      else if(a==='speak'){const w=state.lesson[state.lessonIndex];speak(w.arabic,.62);}
      else if(a==='nextcard'){
        if(state.lessonIndex<state.lesson.length-1){state.lessonIndex++;state.reveal=false;await recordSeen(state.lesson[state.lessonIndex].id);render();}
        else{state.quizIndex=0;prepareQuiz();state.view='quiz';render();}
      }
      else if(a==='audio'){speak(state.lesson[state.quizIndex].arabic,.62);}
      else if(a==='nextquiz'){
        if(state.quizIndex<state.lesson.length-1){state.quizIndex++;prepareQuiz();render();}else{state.view='result';render();}
      }
      else if(a==='home'){state.view='home';render();}
      else if(a==='teacher'){document.getElementById('modal')?.remove();state.view='teacher';render();}
      else if(a==='liveStart'){startLiveConversation();}
      else if(a==='liveStop'){stopLiveConversation();}
      else if(a==='aiConnect'){try{await connectAIFromUserAction();state.liveError='Локальный ИИ готов — регистрация и номер телефона не нужны.';}catch(err){state.aiStatus='offline';state.liveError='Не удалось загрузить локальный ИИ: '+(err?.message||'ошибка');}renderTeacher();}
      else if(a==='voice'){startVoiceInput();}
      else if(a==='send'){sendChat();}
    });
    root.querySelectorAll('[data-lang]').forEach(b=>b.onclick=async()=>{
      state.settings.selectedLanguage=b.dataset.lang;
      syncCourseData();
      state.chat=initialChat();state.aiHistory=[];state.aiStatus=localAIGenerator?'ready':'idle';state.aiModel=localAIGenerator?LOCAL_AI_MODEL:'';state.aiProgress=localAIGenerator?'Локальный ИИ уже загружен.':'';state.liveError='';
      await saveSettings();
      document.getElementById('modal')?.remove();
      state.view='home';
      render();
    });
    root.querySelectorAll('[data-answer]').forEach(b=>b.onclick=async()=>{if(state.selected)return;const id=b.dataset.answer;const correct=state.lesson[state.quizIndex];state.selected=id;const ok=id===correct.id;state.quizResults[correct.id]=ok;await recordAnswer(correct.id,ok);render();});
    root.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>speak(b.dataset.say,.68));
    root.querySelectorAll('[data-chip]').forEach(b=>b.onclick=()=>{const inp=document.getElementById('chatInput');if(inp){inp.value=b.dataset.chip;inp.focus();}});
    const inp=root.querySelector('#chatInput');if(inp)inp.onkeydown=e=>{if(e.key==='Enter')sendChat();};
  }
  async function sendChat(){
    const inp=document.getElementById('chatInput');if(!inp)return;
    const userText=inp.value.trim();if(!userText)return;
    state.chat.push({user:true,text:userText,hint:''});inp.value='';renderTeacher();liveSet('thinking','Думаю над ответом…');
    let reply='';
    try{await connectAIFromUserAction();reply=await askAI(userText);}catch(err){console.warn(err);state.aiStatus='offline';state.liveError='Локальный ИИ сейчас не ответил — включена встроенная подсказка.';reply=coachReply(userText)[0];}
    state.chat.push({user:false,text:reply,hint:''});state.settings.speakingSessions++;state.settings.dailyPoints+=20;await saveSettings();renderTeacher();await speakNatural(reply,.72);
    if(state.liveActive)await beginAutoListening();
  }

  document.addEventListener('visibilitychange',()=>{if(document.hidden&&state.liveActive){stopLiveMedia();state.livePhase='idle';}});
  window.addEventListener('pagehide',()=>{stopLiveMedia();});

  loadState();
})();

  </script>
